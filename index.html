<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="Shri Sai CHS Society Management PWA"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Shri Sai CHS</title><style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f4f7f7;--card:#fff;--text:#172525;--muted:#687777;--line:#e2e9e9;--danger:#b42318;--warn:#a15c00;--ok:#087443;--shadow:0 8px 24px #0b34331a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.user{border:0;background:#edf7f6;padding:9px 12px;border-radius:12px;color:var(--p2);font-weight:700}.main{padding:18px 18px 88px}.hero{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.86}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px #1734340b}.metric b{font-size:24px;display:block;margin-top:5px}.metric small,.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.section h2{font-size:17px;margin:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{max-width:150px;flex:1;border:0;background:none;padding:10px 5px;color:var(--muted);font-size:11px}.tabs button.active{color:var(--p);font-weight:800}.ico{font-size:20px;display:block}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef4f4}.ok{color:var(--ok);background:#eaf8f1}.warn{color:var(--warn);background:#fff4df}.bad{color:var(--danger);background:#fff0ef}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;background:var(--p);color:#fff}.btn.secondary{background:#edf5f4;color:var(--p2)}.btn.danger{background:#fff0ef;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.modal{position:fixed;inset:0;background:#00141466;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(600px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.sheet h2{margin-top:0}.notice{border-left:4px solid var(--p)}.empty{text-align:center;padding:30px;color:var(--muted)}.desktopOnly{display:block}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.desktopOnly{display:none}.main{padding:14px 14px 88px}.hero{border-radius:16px}.card{padding:14px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">SS</div><div><b>Shri Sai CHS</b><small>Sector 10 • Koparkhairne</small></div></div><button class="user" onclick="openModal('profile')">PR</button></header><main id="main" class="main"></main><nav class="tabs"><button data-tab="home" onclick="go('home')"><span class="ico">⌂</span>Home</button><button data-tab="maintenance" onclick="go('maintenance')"><span class="ico">₹</span>Maintenance</button><button data-tab="notices" onclick="go('notices')"><span class="ico">▤</span>Notices</button><button data-tab="complaints" onclick="go('complaints')"><span class="ico">⚒</span>Complaints</button><button data-tab="more" onclick="go('more')"><span class="ico">☰</span>More</button></nav></div><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div><script>
const state={tab:'home',notices:[['Maintenance dues – July 2026','Final reminder for pending maintenance.','29 Sep 2026','Important'],['SGM – Redevelopment','Meeting documents and agenda available.','27 Sep 2026','Redevelopment'],['Water supply update','Scheduled maintenance of water line.','25 Sep 2026','General']],complaints:[['C-1024','Lift vibration on B wing','Open','29 Sep'],['C-1023','Corridor light not working','In progress','28 Sep'],['C-1021','Water leakage near parking','Completed','26 Sep']],ledger:[['Apr 2026','₹3,500','₹3,500','Paid'],['May 2026','₹3,500','₹3,500','Paid'],['Jun 2026','₹3,500','₹3,500','Paid'],['Jul 2026','₹3,500','₹0','Due'],['Aug 2026','₹3,500','₹0','Due'],['Sep 2026','₹3,500','₹0','Due']]};
const main=document.getElementById('main');
function money(n){return '₹'+Number(n).toLocaleString('en-IN')}
function go(tab){state.tab=tab;render()}
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const pages={home:home,maintenance,notices,complaints,more};main.innerHTML=pages[state.tab]();}
function home(){return `<section class="hero"><h1>Namaste, Pratik 👋</h1><p>Welcome to your digital society office.</p><div class="actions" style="margin-top:16px"><button class="btn" onclick="go('maintenance')">View maintenance</button><button class="btn secondary" onclick="openModal('pay')">Pay now</button></div></section><div class="grid"><div class="card metric"><small>Outstanding</small><b>${money(10500)}</b><span class="pill bad">3 months due</span></div><div class="card metric"><small>Open complaints</small><b>2</b><span class="pill warn">1 assigned</span></div><div class="card metric"><small>Documents</small><b>48</b><span class="pill ok">Updated</span></div><div class="card metric"><small>Redevelopment</small><b>78%</b><span class="pill ok">Consent</span></div></div><div class="section"><h2>Latest notices</h2><button class="btn secondary" onclick="go('notices')">View all</button></div><div class="card">${state.notices.slice(0,3).map(n=>`<div class="row"><div><b>${n[0]}</b><div class="muted">${n[2]} • ${n[3]}</div></div><span>›</span></div>`).join('')}</div><div class="section"><h2>Quick actions</h2></div><div class="grid"><div class="card"><b>Raise complaint</b><p class="muted">Report an issue to the committee.</p><button class="btn" onclick="openModal('complaint')">Create</button></div><div class="card"><b>Society documents</b><p class="muted">Minutes, notices, audits and tenders.</p><button class="btn secondary" onclick="go('more')">Open</button></div></div>`}
function maintenance(){return `<div class="section"><h2>Maintenance Ledger</h2><button class="btn" onclick="openModal('pay')">Pay ₹10,500</button></div><div class="card"><div class="row"><div><small class="muted">Current outstanding</small><h2 style="margin:4px 0">${money(10500)}</h2></div><span class="pill bad">Due</span></div><div class="row"><span>Flat</span><b>A-102</b></div><div class="row"><span>Member</span><b>Pratik Wadkar</b></div></div><div class="section"><h2>Month-wise statement</h2><button class="btn secondary" onclick="openModal('statement')">Download</button></div><div class="card">${state.ledger.map(x=>`<div class="row"><div><b>${x[0]}</b><div class="muted">Demand ${x[1]} • Paid ${x[2]}</div></div><span class="pill ${x[3]==='Paid'?'ok':'bad'}">${x[3]}</span></div>`).join('')}</div><div class="section"><h2>Payment history</h2></div><div class="card"><div class="row"><div><b>Receipt #1045</b><div class="muted">29 Mar 2026 • UPI</div></div><b>${money(3500)}</b></div><div class="row"><div><b>Receipt #1009</b><div class="muted">28 Feb 2026 • UPI</div></div><b>${money(3500)}</b></div></div>`}
function notices(){return `<div class="section"><h2>Notices & Documents</h2><button class="btn" onclick="openModal('notice')">Add notice</button></div><input class="search" placeholder="Search notices, minutes, tenders…" oninput="filterNotices(this.value)"><div id="noticeList" class="card" style="margin-top:12px">${noticeRows(state.notices)}</div>`}
function noticeRows(arr){return arr.length?arr.map(n=>`<div class="row notice"><div><b>${n[0]}</b><div class="muted">${n[2]} • ${n[3]}</div><div style="margin-top:5px">${n[1]}</div></div><button class="btn secondary" onclick="openModal('document')">View</button></div>`).join(''):'<div class="empty">No matching documents.</div>'}
function filterNotices(q){document.getElementById('noticeList').innerHTML=noticeRows(state.notices.filter(n=>n.join(' ').toLowerCase().includes(q.toLowerCase())))}
function complaints(){return `<div class="section"><h2>Complaints</h2><button class="btn" onclick="openModal('complaint')">+ New complaint</button></div><div class="card">${state.complaints.map(c=>`<div class="row"><div><b>${c[0]} • ${c[1]}</b><div class="muted">Raised ${c[3]}</div></div><span class="pill ${c[2]==='Completed'?'ok':c[2]==='In progress'?'warn':'bad'}">${c[2]}</span></div>`).join('')}</div><div class="section"><h2>Process</h2></div><div class="card"><div class="row"><span>1. Raised</span><span>✓</span></div><div class="row"><span>2. Assigned</span><span>✓</span></div><div class="row"><span>3. Work in progress</span><span>→</span></div><div class="row"><span>4. Member confirmation</span><span>Pending</span></div></div>`}
function more(){return `<div class="section"><h2>Society Portal</h2></div><div class="grid"><div class="card"><b>👥 Members</b><p class="muted">Member directory and flat records.</p></div><div class="card"><b>📊 Committee Dashboard</b><p class="muted">Collection, dues, bills and approvals.</p></div><div class="card" onclick="openModal('redevelopment')"><b>🏗 Redevelopment</b><p class="muted">PMC, proposals, consent and records.</p><button class="btn secondary">Open</button></div><div class="card"><b>📁 Documents</b><p class="muted">Audit reports, resolutions and agreements.</p></div><div class="card"><b>💼 Expenses & Vendors</b><p class="muted">Quotation → approval → bill → payment.</p></div><div class="card"><b>🔐 Audit Log</b><p class="muted">Immutable history of important actions.</p></div></div><div class="section"><h2>System</h2></div><div class="card"><div class="row"><span>App version</span><b>0.1.0</b></div><div class="row"><span>Offline support</span><span class="pill ok">Enabled</span></div><div class="row"><span>Data storage</span><span>Local demo</span></div></div>`}
function openModal(type){const s=document.getElementById('sheet');let html='';if(type==='pay')html=`<h2>Pay Maintenance</h2><p class="muted">Demo payment flow. In production this will open your payment gateway.</p><div class="card"><div class="row"><span>Outstanding</span><b>${money(10500)}</b></div><div class="row"><span>Flat</span><b>A-102</b></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="demoPay()">Proceed to payment</button>`;else if(type==='complaint')html=`<h2>Raise Complaint</h2><div class="form"><select><option>Plumbing</option><option>Electrical</option><option>Lift</option><option>Water</option><option>Security</option><option>Cleaning</option><option>Civil work</option></select><input placeholder="Short title"><textarea rows="4" placeholder="Describe the issue"></textarea><input type="file"><button class="btn" onclick="saveComplaint()">Submit complaint</button></div>`;else if(type==='notice')html=`<h2>Add Notice</h2><div class="form"><input placeholder="Notice title"><select><option>General</option><option>Maintenance</option><option>Redevelopment</option><option>Meeting</option></select><textarea rows="4" placeholder="Notice content"></textarea><input type="file"><button class="btn" onclick="closeModal();alert('Demo notice saved locally.')">Publish notice</button></div>`;else if(type==='redevelopment')html=`<h2>Redevelopment</h2><div class="grid"><div class="card metric"><small>PMC</small><b>3</b></div><div class="card metric"><small>Consent</small><b>78%</b></div><div class="card metric"><small>Documents</small><b>24</b></div><div class="card metric"><small>Status</small><b>Active</b></div></div><div class="card"><div class="row"><span>PMC shortlisted</span><span class="pill ok">Complete</span></div><div class="row"><span>Developer proposals</span><span class="pill warn">Review</span></div><div class="row"><span>Member consent</span><span class="pill warn">78%</span></div><div class="row"><span>SGM records</span><span>12 files</span></div></div>`;else if(type==='statement')html=`<h2>Statement</h2><p>Your statement is ready in this demo.</p><button class="btn" onclick="closeModal();alert('Demo PDF export would be generated here.')">Export PDF</button>`;else if(type==='document')html=`<h2>Document preview</h2><div class="card"><b>Redevelopment / SGM Document</b><p class="muted">In the production version, secure documents will be served from object storage with role-based access and download logging.</p></div>`;else html=`<h2>My Profile</h2><div class="card"><div class="row"><span>Name</span><b>Pratik Wadkar</b></div><div class="row"><span>Flat</span><b>A-102</b></div><div class="row"><span>Role</span><b>Member</b></div><div class="row"><span>Last login</span><b>29 Sep 2026</b></div></div>`;s.innerHTML=html+`<button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function demoPay(){closeModal();alert('Demo only: connect Razorpay/PayU/CCAvenue webhook on the backend before using real payments.')}
function saveComplaint(){state.complaints.unshift(['C-'+Math.floor(1000+Math.random()*8999),'New society complaint','Open','Today']);closeModal();go('complaints')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
render();
</script></body></html>
