<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><meta name="description" content="Shri Sai CHS Society Management PWA"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>Shri Sai CHS</title><style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f4f7f7;--card:#fff;--text:#172525;--muted:#687777;--line:#e2e9e9;--danger:#b42318;--warn:#a15c00;--ok:#087443;--shadow:0 8px 24px #0b34331a}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;color:#fff;font-weight:800}.brand b{display:block}.brand small{color:var(--muted)}.user{border:0;background:#edf7f6;padding:9px 12px;border-radius:12px;color:var(--p2);font-weight:700}.main{padding:18px 18px 88px}.hero{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.hero h1{margin:0 0 6px;font-size:24px}.hero p{margin:0;opacity:.86}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 14px #1734340b}.metric b{font-size:24px;display:block;margin-top:5px}.metric small,.muted{color:var(--muted)}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px;gap:10px}.section h2{font-size:17px;margin:0}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}.tabs button{max-width:150px;flex:1;border:0;background:none;padding:10px 5px;color:var(--muted);font-size:11px}.tabs button.active{color:var(--p);font-weight:800}.ico{font-size:20px;display:block}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef4f4;white-space:nowrap}.ok{color:var(--ok);background:#eaf8f1}.warn{color:var(--warn);background:#fff4df}.bad{color:var(--danger);background:#fff0ef}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750;background:var(--p);color:#fff}.btn.secondary{background:#edf5f4;color:var(--p2)}.btn.danger{background:#fff0ef;color:var(--danger)}.btn.small{padding:7px 9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.modal{position:fixed;inset:0;background:#00141466;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(700px,100%);border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet h2{margin-top:0}.notice{border-left:4px solid var(--p)}.empty{text-align:center;padding:30px;color:var(--muted)}.membergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.membercard{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.membercard b{display:block}.tablewrap{overflow:auto}.adminbar{background:#ecf8f6;border:1px solid #cce8e4;padding:12px;border-radius:14px;margin:12px 0}.tag{font-size:11px;border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:#fafcfc}.docgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.doc{padding:10px;border:1px solid var(--line);border-radius:10px}.receipt{border:2px solid #183c39;border-radius:8px;padding:18px;background:#fff}.receipt h1{text-align:center;font-size:20px;margin:0}.receipt .sub{text-align:center;font-size:12px;margin:3px 0 14px}.receipt .rline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #aaa}.receipt .total{font-size:18px;font-weight:800}.no-print{display:block}@media print{body{background:#fff}.no-print,.modal> .sheet>button,.top,.tabs{display:none!important}.modal{position:static;display:block;background:#fff}.sheet{max-height:none;width:100%;border-radius:0;padding:0}.receipt{border:1px solid #222}.app{display:none}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:14px 14px 88px}.hero{border-radius:16px}.card{padding:14px}.membergrid,.docgrid{grid-template-columns:1fr}.desktopOnly{display:none}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">SS</div><div><b>Shri Sai CHS</b><small>Sector 10 • Koparkhairne</small></div></div><button class="user" onclick="openModal('profile')">ADMIN</button></header><main id="main" class="main"></main><nav class="tabs"><button data-tab="home" onclick="go('home')"><span class="ico">⌂</span>Home</button><button data-tab="maintenance" onclick="go('maintenance')"><span class="ico">₹</span>Maintenance</button><button data-tab="members" onclick="go('members')"><span class="ico">👥</span>Members</button><button data-tab="notices" onclick="go('notices')"><span class="ico">▤</span>Notices</button><button data-tab="more" onclick="go('more')"><span class="ico">☰</span>More</button></nav></div><div id="modal" class="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div><script>
const KEY='shri-sai-chs-demo-v2';
function makeMembers(){let a=[];for(let i=1;i<=26;i++){a.push(member(`5-A-${String(i).padStart(2,'0')}`));a.push(member(`5-B-${String(i).padStart(2,'0')}`))}return a}
const first=['Amit','Suresh','Vijay','Prakash','Ramesh','Mahesh','Sunil','Nitin','Rajesh','Anil','Deepak','Sachin','Mohan','Dinesh','Ajay','Ganesh','Rohit','Kiran','Santosh','Manoj','Swapnil','Pankaj','Shailesh','Vivek','Amol','Rahul'];
const last=['Patil','Shinde','Jadhav','More','Pawar','Deshmukh','Kulkarni','Joshi','Wadkar','Chavan','Kadam','Bhosale','Sawant','Mane','Naik','Gaikwad','Thakur','Mhatre','Salunkhe','Gore','Shelar','Pujari','Kamble','Tambe','Wagh','Mali'];
function member(flat){let n=Number(flat.slice(-2));let idx=(n-1)%26;let mobile='98'+String(10000000+n*137).slice(0,8);return {id:flat,name:`${first[idx]} ${last[(idx+7)%26]}`,flat,mobile,email:`${flat.toLowerCase().replace(/-/g,'')}@example.com`,ownerStatus:n%4===0?'Tenant':'Owner',tenant:n%4===0?{name:`${['Rohan','Neha','Akash','Pooja','Vishal','Sneha'][idx%6]} ${last[(idx+11)%26]}`,mobile:'99'+String(20000000+n*113).slice(0,8),from:'01 Apr 2026',to:'31 Mar 2027'}:null,noc:n%4===0?'Pending':'Not Required',documents:{shareCertificate:'Uploaded',aadhaar:'Uploaded',pan:'Uploaded',photo:'Uploaded',nomination:n%5===0?'Pending':'Uploaded',rentAgreement:n%4===0?'Uploaded':'Not Required',tenantPoliceVerification:n%4===0?(n%8===0?'Pending':'Uploaded'):'Not Required',noc:n%4===0?'Pending':'Not Required'},maintenance:1000,paidMonths:[],notificationOptIn:true}}
let stored;try{stored=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
const state=stored||{tab:'home',members:makeMembers(),notices:[['Maintenance circular – October 2026','Monthly maintenance of ₹1,000 is payable by the 10th of every month.','29 Sep 2026','Maintenance'],['SGM – Redevelopment','Meeting documents and agenda available.','27 Sep 2026','Redevelopment'],['Water supply update','Scheduled maintenance of water line.','25 Sep 2026','General']],complaints:[['C-1024','Lift vibration on B wing','Open','29 Sep'],['C-1023','Corridor light not working','In progress','28 Sep']],receipts:[],audit:[],lastNotificationRun:null};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function money(n){return '₹'+Number(n).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(tab){state.tab=tab;save();render()}function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const pages={home,maintenance,members,notices,more};main.innerHTML=pages[state.tab]();}
function home(){let paid=state.members.filter(m=>m.paidMonths.includes('Sep 2026')).length;let outstanding=(52-paid)*1000;let pendingDocs=state.members.reduce((x,m)=>x+Object.values(m.documents).filter(v=>v==='Pending').length,0);return `<section class="hero"><h1>Namaste, Admin 👋</h1><p>Shri Sai CHS — Society Management Portal</p><div class="actions" style="margin-top:16px"><button class="btn" onclick="go('members')">Manage 52 members</button><button class="btn secondary" onclick="openModal('notify')">Monthly notifications</button></div></section><div class="grid"><div class="card metric"><small>Total members</small><b>52</b><span class="pill ok">5-A 01–26 • 5-B 01–26</span></div><div class="card metric"><small>September collection</small><b>${money(paid*1000)}</b><span class="pill ${paid===52?'ok':'warn'}">${paid}/52 paid</span></div><div class="card metric"><small>Outstanding</small><b>${money(outstanding)}</b><span class="pill bad">${52-paid} members</span></div><div class="card metric"><small>Pending documents</small><b>${pendingDocs}</b><span class="pill ${pendingDocs?'warn':'ok'}">${pendingDocs?'Review':'Complete'}</span></div></div><div class="adminbar"><b>📱 Monthly SMS reminder</b><div class="muted" style="margin-top:4px">Configured for the 1st of every month. Each member receives their actual maintenance demand based on the ledger. Demo mode shows the message; production SMS requires an SMS provider + backend scheduler.</div><div class="actions" style="margin-top:9px"><button class="btn small" onclick="openModal('notify')">View notification setup</button><button class="btn secondary small" onclick="sendAllDemo()">Run demo now</button></div></div><div class="section"><h2>Member payment status</h2><button class="btn secondary" onclick="go('maintenance')">Open ledger</button></div><div class="card">${state.members.slice(0,8).map(memberRow).join('')}<button class="btn secondary" style="width:100%;margin-top:12px" onclick="go('members')">View all 52 members</button></div>`}
function memberRow(m){let paid=m.paidMonths.includes('Sep 2026');return `<div class="row"><div><b>${esc(m.flat)} • ${esc(m.name)}</b><div class="muted">${esc(m.mobile)} • ${m.ownerStatus}</div></div><div class="actions"><span class="pill ${paid?'ok':'bad'}">${paid?'Paid':'₹1,000 Due'}</span><button class="btn secondary small" onclick="openMember('${m.flat}')">View</button></div></div>`}
function maintenance(){let paid=state.members.filter(m=>m.paidMonths.includes('Sep 2026')).length;return `<div class="section"><h2>Maintenance — Admin Ledger</h2><button class="btn" onclick="openModal('bulk')">Bulk action</button></div><div class="card"><div class="row"><span>Monthly maintenance per member</span><b>${money(1000)}</b></div><div class="row"><span>September 2026 demand</span><b>${money(52000)}</b></div><div class="row"><span>Collected</span><b>${money(paid*1000)}</b></div><div class="row"><span>Outstanding</span><b>${money((52-paid)*1000)}</b></div></div><div class="section"><h2>52-member ledger</h2><input class="search" style="max-width:260px" placeholder="Search flat/name" oninput="filterMembers(this.value,'maintenanceList')"></div><div id="maintenanceList" class="card">${state.members.map(maintenanceRow).join('')}</div>`}
function maintenanceRow(m){let paid=m.paidMonths.includes('Sep 2026');return `<div class="row"><div><b>${esc(m.flat)} • ${esc(m.name)}</b><div class="muted">Sep 2026 • ${money(1000)} • ${esc(m.mobile)}</div></div><div class="actions">${paid?`<button class="btn secondary small" onclick="receipt('${m.flat}')">Receipt</button>`:`<button class="btn small" onclick="markPaid('${m.flat}')">Mark paid</button>`}</div></div>`}
function members(){return `<div class="section"><h2>Members (52)</h2><button class="btn" onclick="openModal('addmember')">+ Add member</button></div><div class="adminbar"><b>Flat numbering</b><div class="muted">5-A-01 to 5-A-26 and 5-B-01 to 5-B-26</div></div><input class="search" placeholder="Search flat, member, mobile, tenant…" oninput="filterMembers(this.value,'memberList')"><div id="memberList" class="membergrid" style="margin-top:12px">${state.members.map(memberCard).join('')}</div>`}
function memberCard(m){let pending=Object.values(m.documents).filter(x=>x==='Pending').length;return `<div class="membercard"><div class="actions" style="justify-content:space-between"><span class="tag">${esc(m.flat)}</span><span class="pill ${pending?'warn':'ok'}">${pending?pending+' docs pending':'Docs complete'}</span></div><b style="margin-top:9px">${esc(m.name)}</b><div class="muted">${esc(m.mobile)} • ${esc(m.ownerStatus)}</div><div class="muted">Maintenance: ${money(1000)} / month</div>${m.tenant?`<div style="margin-top:8px"><span class="tag">Tenant: ${esc(m.tenant.name)}</span></div>`:''}<div class="actions" style="margin-top:10px"><button class="btn small" onclick="openMember('${m.flat}')">Open profile</button>${m.paidMonths.includes('Sep 2026')?`<button class="btn secondary small" onclick="receipt('${m.flat}')">Receipt</button>`:`<button class="btn secondary small" onclick="markPaid('${m.flat}')">Mark paid</button>`}</div></div>`}
function filterMembers(q,target){q=q.toLowerCase();let arr=state.members.filter(m=>(m.flat+' '+m.name+' '+m.mobile+' '+(m.tenant?.name||'')).toLowerCase().includes(q));document.getElementById(target).innerHTML=target==='memberList'?arr.map(memberCard).join(''):arr.map(maintenanceRow).join('')}
function notices(){return `<div class="section"><h2>Notices & Documents</h2><button class="btn" onclick="openModal('notice')">Add notice</button></div><input class="search" placeholder="Search notices, minutes, tenders…" oninput="filterNotices(this.value)"><div id="noticeList" class="card" style="margin-top:12px">${noticeRows(state.notices)}</div>`}
function noticeRows(arr){return arr.length?arr.map(n=>`<div class="row notice"><div><b>${esc(n[0])}</b><div class="muted">${esc(n[2])} • ${esc(n[3])}</div><div style="margin-top:5px">${esc(n[1])}</div></div><button class="btn secondary small" onclick="openModal('document')">View</button></div>`).join(''):'<div class="empty">No matching documents.</div>'}function filterNotices(q){document.getElementById('noticeList').innerHTML=noticeRows(state.notices.filter(n=>n.join(' ').toLowerCase().includes(q.toLowerCase())))}
function more(){return `<div class="section"><h2>Admin Portal</h2></div><div class="grid"><div class="card"><b>👥 Members</b><p class="muted">52 member records, flat details, tenants and documents.</p><button class="btn secondary" onclick="go('members')">Open</button></div><div class="card"><b>💳 Payments</b><p class="muted">Mark payment received and generate Shri Sai CHS receipt.</p><button class="btn secondary" onclick="go('maintenance')">Open</button></div><div class="card" onclick="openModal('redevelopment')"><b>🏗 Redevelopment</b><p class="muted">PMC, proposals, consent and records.</p><button class="btn secondary">Open</button></div><div class="card"><b>📱 Notifications</b><p class="muted">Monthly 1st-date maintenance reminders.</p><button class="btn secondary" onclick="openModal('notify')">Configure</button></div><div class="card"><b>📁 Documents</b><p class="muted">Share certificate, nomination, tenant agreement, NOC and verification.</p></div><div class="card"><b>🔐 Audit Log</b><p class="muted">Important admin actions are recorded locally in this demo.</p><button class="btn secondary" onclick="openModal('audit')">View</button></div></div><div class="card"><div class="row"><span>App version</span><b>0.2.0</b></div><div class="row"><span>Members</span><b>52</b></div><div class="row"><span>Maintenance</span><b>₹1,000/month/member</b></div><div class="row"><span>SMS scheduler</span><span class="pill warn">Backend required for production</span></div></div>`}
function openMember(flat){let m=state.members.find(x=>x.flat===flat);let docs=Object.entries(m.documents).map(([k,v])=>`<div class="doc"><b>${label(k)}</b><div class="muted">${v}</div>${v!=='Not Required'?`<button class="btn secondary small" style="margin-top:6px" onclick="demoDoc('${flat}','${k}')">${v==='Uploaded'?'View':'Upload'}</button>`:''}</div>`).join('');openHtml(`<h2>${esc(m.flat)} — ${esc(m.name)}</h2><div class="card"><div class="row"><span>Mobile</span><b>${esc(m.mobile)}</b></div><div class="row"><span>Email</span><b>${esc(m.email)}</b></div><div class="row"><span>Status</span><b>${esc(m.ownerStatus)}</b></div><div class="row"><span>Monthly maintenance</span><b>${money(m.maintenance)}</b></div></div>${m.tenant?`<div class="section"><h2>Rented Person / Tenant</h2></div><div class="card"><div class="row"><span>Name</span><b>${esc(m.tenant.name)}</b></div><div class="row"><span>Mobile</span><b>${esc(m.tenant.mobile)}</b></div><div class="row"><span>Agreement</span><b>${esc(m.tenant.from)} – ${esc(m.tenant.to)}</b></div><div class="row"><span>NOC</span><span class="pill ${m.noc==='Pending'?'warn':'ok'}">${m.noc}</span></div></div>`:'<div class="section"><h2>Rented Person / Tenant</h2></div><div class="card"><span class="pill ok">Not applicable — owner occupied</span></div>'}<div class="section"><h2>Required Documents</h2></div><div class="docgrid">${docs}</div><div class="section"><h2>September 2026</h2></div><div class="card"><div class="row"><span>Demand</span><b>${money(1000)}</b></div><div class="row"><span>Status</span><span class="pill ${m.paidMonths.includes('Sep 2026')?'ok':'bad'}">${m.paidMonths.includes('Sep 2026')?'Paid':'Due'}</span></div></div><div class="actions"><button class="btn" onclick="${m.paidMonths.includes('Sep 2026')?`receipt('${m.flat}')`:`markPaid('${m.flat}')`}">${m.paidMonths.includes('Sep 2026')?'Generate receipt':'Mark payment received'}</button>${m.paidMonths.includes('Sep 2026')?`<button class="btn secondary" onclick="receipt('${m.flat}')">Print receipt</button>`:''}</div>`)}
function label(k){return ({shareCertificate:'Share Certificate',aadhaar:'Aadhaar',pan:'PAN',photo:'Member Photo',nomination:'Nomination',rentAgreement:'Rent Agreement',tenantPoliceVerification:'Tenant Police Verification',noc:'Society NOC'})[k]||k}
function markPaid(flat){let m=state.members.find(x=>x.flat===flat);if(!m.paidMonths.includes('Sep 2026'))m.paidMonths.push('Sep 2026');let r={no:'SSCHS-'+String(1001+state.receipts.length).padStart(4,'0'),flat,member:m.name,amount:1000,month:'September 2026',date:new Date().toLocaleDateString('en-IN'),mode:'Cash / UPI'};state.receipts.push(r);state.audit.unshift({date:new Date().toLocaleString('en-IN'),action:'Payment received',detail:`${flat} • ₹1,000 • Receipt ${r.no}`});save();alert('Payment marked received. Shri Sai CHS receipt generated.');receipt(flat);}
function receipt(flat){let m=state.members.find(x=>x.flat===flat);let r=[...state.receipts].reverse().find(x=>x.flat===flat)||{no:'SSCHS-DEMO',flat,member:m.name,amount:1000,month:'September 2026',date:new Date().toLocaleDateString('en-IN'),mode:'Demo'};openHtml(`<div class="receipt" id="receipt"><h1>SHRI SAI CO-OPERATIVE HOUSING SOCIETY LTD.</h1><div class="sub">Sector 10, Koparkhairne, Navi Mumbai</div><h2 style="text-align:center">MAINTENANCE RECEIPT</h2><div class="rline"><span>Receipt No.</span><b>${esc(r.no)}</b></div><div class="rline"><span>Date</span><b>${esc(r.date)}</b></div><div class="rline"><span>Member</span><b>${esc(r.member)}</b></div><div class="rline"><span>Flat No.</span><b>${esc(r.flat)}</b></div><div class="rline"><span>For</span><b>${esc(r.month)} Maintenance</b></div><div class="rline"><span>Payment Mode</span><b>${esc(r.mode)}</b></div><div class="rline total"><span>Amount Received</span><b>${money(r.amount)}</b></div><p style="margin-top:22px;font-size:12px">Received with thanks towards society maintenance charges.</p><div style="display:flex;justify-content:space-between;margin-top:36px;font-size:12px"><span>Member Signature</span><span>For Shri Sai CHS</span></div></div><div class="actions no-print" style="margin-top:12px"><button class="btn" onclick="window.print()">Print / Save PDF</button></div>`)}
function sendAllDemo(){let month='October 2026';state.lastNotificationRun=new Date().toLocaleString('en-IN');state.audit.unshift({date:state.lastNotificationRun,action:'Demo monthly SMS run',detail:'52 maintenance reminders generated'});save();openHtml(`<h2>Demo SMS Run</h2><p class="muted">52 reminders generated. In production these messages will be sent to each stored mobile number by the SMS provider.</p><div class="card">${state.members.slice(0,5).map(m=>`<div class="row"><div><b>${m.flat} • ${m.mobile}</b><div class="muted">Dear ${m.name}, Shri Sai CHS maintenance for ${month} is ₹${m.maintenance}. Please pay by the due date.</div></div><span class="pill ok">Queued</span></div>`).join('')}<div class="muted" style="padding-top:10px">+ ${state.members.length-5} more reminders</div></div>`)}
function openModal(type){if(type==='notify')openHtml(`<h2>Monthly Maintenance Notifications</h2><div class="card"><div class="row"><span>Schedule</span><b>1st of every month</b></div><div class="row"><span>Recipients</span><b>All 52 member mobiles</b></div><div class="row"><span>Amount</span><b>Each member's ledger demand</b></div><div class="row"><span>Message</span><b>Maintenance reminder</b></div><div class="row"><span>Production status</span><span class="pill warn">SMS provider + backend scheduler required</span></div></div><p class="muted">The PWA can display notifications, but reliable SMS on the 1st of every month requires a server-side scheduler and an SMS provider such as MSG91, Twilio or another India-supported gateway. The backend should read each member's current maintenance balance and send the message to the stored mobile number.</p><button class="btn" onclick="sendAllDemo()">Run demo SMS now</button>`);else if(type==='audit')openHtml(`<h2>Audit Log</h2><div class="card">${state.audit.length?state.audit.slice(0,30).map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div class="muted">${esc(a.detail)}</div></div><small>${esc(a.date)}</small></div>`).join(''):'<div class="empty">No audit entries yet.</div>'}</div>`);else if(type==='profile')openHtml(`<h2>Admin Profile</h2><div class="card"><div class="row"><span>Name</span><b>Society Admin</b></div><div class="row"><span>Role</span><b>Administrator</b></div><div class="row"><span>Access</span><b>Members • Payments • Documents • Reports</b></div></div>`);else if(type==='bulk')openHtml(`<h2>Bulk Maintenance Action</h2><p class="muted">Demo: mark all 52 members as paid for September 2026.</p><button class="btn" onclick="state.members.forEach(m=>{if(!m.paidMonths.includes('Sep 2026'))m.paidMonths.push('Sep 2026')});state.audit.unshift({date:new Date().toLocaleString('en-IN'),action:'Bulk payment demo',detail:'September 2026 marked paid for 52 members'});save();closeModal();render();alert('All 52 marked paid in demo.');">Mark all paid</button>`);else if(type==='addmember')openHtml(`<h2>Add Member</h2><div class="form"><input placeholder="Flat number, e.g. 5-A-01"><input placeholder="Member name"><input placeholder="Mobile number"><select><option>Owner</option><option>Tenant</option></select><button class="btn" onclick="alert('Demo only. Production version will save the member through the backend and require documents.')">Save member</button></div>`);else if(type==='notice')openHtml(`<h2>Add Notice</h2><div class="form"><input placeholder="Notice title"><select><option>General</option><option>Maintenance</option><option>Redevelopment</option><option>Meeting</option></select><textarea rows="4" placeholder="Notice content"></textarea><input type="file"><button class="btn" onclick="closeModal();alert('Demo notice saved locally.')">Publish notice</button></div>`);else if(type==='document')openHtml(`<h2>Document preview</h2><div class="card"><b>Society document</b><p class="muted">Production version will store documents in secure object storage with role-based access and download audit logs.</p></div>`);else if(type==='redevelopment')openHtml(`<h2>Redevelopment</h2><div class="grid"><div class="card metric"><small>PMC</small><b>3</b></div><div class="card metric"><small>Consent</small><b>78%</b></div><div class="card metric"><small>Documents</small><b>24</b></div><div class="card metric"><small>Status</small><b>Active</b></div></div><div class="card"><div class="row"><span>PMC shortlisted</span><span class="pill ok">Complete</span></div><div class="row"><span>Developer proposals</span><span class="pill warn">Review</span></div><div class="row"><span>Member consent</span><span class="pill warn">78%</span></div></div>`);else openHtml(`<h2>System</h2><div class="card"><p class="muted">Demo portal.</p></div>`)}
function openHtml(html){document.getElementById('sheet').innerHTML=html+`<button class="btn secondary no-print" style="width:100%;margin-top:10px" onclick="closeModal()">Close</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function demoDoc(flat,key){alert(`${label(key)}: demo document action for ${flat}. Production upload will store the document securely and record the upload in the audit log.`)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));render();
</script></body></html>
