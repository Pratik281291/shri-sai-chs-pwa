 <div class="section"><h2>${esc(selected.name)} — ${fy} मासिक देणी</h2></div><div class="card">${months.map(month=>{let paid=isPaid(selected,month);return `<div class="row"><div><b>${month}</b><div class="muted">देय ${money(selected.maintenance)}</div></div><div class="actions">${paid?'<span class="pill ok">भरले</span><button class="btn secondary small" onclick="receiptForMonth(\''+selected.flat+'\',\''+month+'\',\''+fy+'\')">पावती</button>':'<button class="btn small" onclick="markPaidMonth(\''+selected.flat+'\',\''+month+'\',\''+fy+'\')">भरणा नोंदवा</button>'}</div></div>`}).join('')}</div>
 <div class="section"><h2>सर्व 52 सभासद — ${fy}</h2></div><input class="search" placeholder="सभासदाचे नाव / मोबाइल शोधा" oninput="filterMembers(this.value,'maintenanceList')"><div id="maintenanceList" class="card">${state.members.map(m=>maintenanceFYRow(m,fy)).join('')}</div>`}
function maintenanceFYRow(m,fy){let months=fyMonths(fy);let paid=months.filter(x=>isPaid(m,x)).length;let due=(months.length-paid)*m.maintenance;return `<div class="row"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.mobile)} • ${fy}</div></div><div class="actions"><span class="pill ${due?'bad':'ok'}">${due?money(due)+' बाकी':'पूर्ण'}</span><button class="btn secondary small" onclick="state.selectedMemberFlat='${m.flat}';save();render()">निवडा</button></div></div>`}

function feedbackModal(){let rows=state.feedback.map(f=>`<div class="listitem"><h3>${esc(f.type)} • ${esc(f.date)}</h3><div>${esc(f.text)}</div><span class="badge">${esc(f.status)}</span></div>`).join('');openHtml(`<h2>Feedback / Concerns</h2><button class="btn" onclick="openModal('newfeedback')">+ अभिप्राय / चिंता</button><div class="section"><h2>नोंदी</h2></div><div class="listbox">${rows||'<div class="empty">अजून अभिप्राय नाही.</div>'}</div>`)}
function legalModal(){let p=state.penalties.map(x=>`<div class="listitem"><h3>${esc(x.member)} • ${esc(x.reason)}</h3><div class="row"><span>दंड</span><b>${money(x.amount)}</b></div><div class="muted">${esc(x.date)} • ${esc(x.status)}</div></div>`).join('');let l=state.legalActions.map(x=>`<div class="listitem legalbox"><h3>${esc(x.member)} • ${esc(x.stage)}</h3><div class="muted">${esc(x.date)} • ${esc(x.status)}</div></div>`).join('');openHtml(`<h2>दंड व कायदेशीर कारवाई</h2><div class="section"><h2>दंड / Penalty</h2><button class="btn secondary small" onclick="openModal('penalty')">+ दंड नोंद</button></div><div class="listbox">${p}</div><div class="section"><h2>थकबाकीदारांवरील कायदेशीर कारवाई</h2><button class="btn secondary small" onclick="openModal('legaladd')">+ कारवाई नोंद</button></div><div class="listbox">${l}</div><p class="muted" style="margin-top:12px">कायदेशीर कारवाईचा प्रत्यक्ष प्रकार, नोटीस व वसुली प्रक्रिया सोसायटीचे उपविधी, लागू कायदा/नियम आणि सक्षम सल्ल्यानुसार निश्चित करावी.</p>`)}
function actModal(){openHtml(`<h2>महाराष्ट्र सहकारी संस्था कायदा — महत्त्वाचे संदर्भ</h2><div class="card legalbox"><b>नोंदणी प्रमाणपत्रावर नमूद संदर्भ</b><p>${esc(SOCIETY.act)}</p><p>संस्थेची नोंदणी प्रमाणपत्रानुसार अधिनियमातील <b>कलम 9(1)</b> अन्वये आहे. प्रमाणपत्रात पुढे अधिनियमातील <b>कलम 12(1)</b> व महाराष्ट्र सहकारी संस्थांचे नियम, 1961 मधील नियम <b>10(1)</b> यांचा संदर्भ देऊन संस्थेचे वर्गीकरण नमूद आहे.</p></div><div class="listbox"><div class="listitem"><b>कलम 9(1)</b><div class="muted">या सोसायटीच्या नोंदणी प्रमाणपत्रावर थेट नमूद.</div></div><div class="listitem"><b>कलम 12(1)</b><div class="muted">नोंदणी प्रमाणपत्रावरील संस्थेच्या वर्गीकरणाशी संबंधित संदर्भ.</div></div><div class="listitem"><b>नियम 10(1), महाराष्ट्र सहकारी संस्थांचे नियम 1961</b><div class="muted">नोंदणी प्रमाणपत्रावरील वर्गीकरण संदर्भ.</div></div></div><div class="adminbar"><b>महत्त्वाची सूचना</b><div class="muted">हा विभाग नोंदणी प्रमाणपत्रातील संदर्भ दाखवतो. इतर कलमे/कायदेशीर कारवाईसाठी अद्ययावत अधिकृत कायदा, नियम व संस्थेचे नोंदणीकृत उपविधी तपासणे आवश्यक आहे.</div></div>`)}
function waterModal(){openHtml(`<h2>💧 पाणीपुरवठा वेळ</h2><div class="card"><div class="row"><span>सकाळी</span><b>${esc(state.water.morning)}</b></div><div class="row"><span>संध्याकाळी</span><b>${esc(state.water.evening)}</b></div></div><button class="btn" onclick="editWater()">वेळ बदलण्याचा डेमो</button>`)}
function editWater(){let m=prompt('सकाळची वेळ',state.water.morning);if(m!==null)state.water.morning=m;let e=prompt('संध्याकाळची वेळ',state.water.evening);if(e!==null)state.water.evening=e;save();closeModal();render()}
function caretakerModal(){openHtml(`<h2>🧹 केअरटेकर / सेवक</h2><div class="card"><div class="row"><span>नाव</span><b>${esc(state.caretaker.name)}</b></div><div class="row"><span>भूमिका</span><b>${esc(state.caretaker.role)}</b></div><div class="row"><span>मासिक वेतन</span><b>${money(state.caretaker.salary)}</b></div><div class="row"><span>मोबाइल</span><b>${esc(state.caretaker.mobile)}</b></div><div class="row"><span>उपस्थिती</span><b>${esc(state.caretaker.attendance)}</b></div></div><div class="section"><h2>कामांची यादी</h2></div><div class="listbox">${state.caretaker.works.map(w=>`<div class="listitem">✓ ${esc(w)}</div>`).join('')}</div><button class="btn" onclick="alert('डेमो: कर्मचारी पगार/उपस्थिती backend मध्ये जतन केली जाईल.')">पगार नोंद</button>`)}
function openModal(type){
 if(type==='notify')openHtml(`<h2>📱 मासिक देखभाल सूचना</h2><div class="card"><div class="row"><span>वेळापत्रक</span><b>दर महिन्याची १ तारीख</b></div><div class="row"><span>प्राप्तकर्ता</span><b>सर्व 52 सभासद मोबाइल</b></div><div class="row"><span>रक्कम</span><b>प्रत्येक सभासदाची चालू मागणी</b></div><div class="row"><span>स्थिती</span><span class="pill warn">Production: SMS provider + backend scheduler</span></div></div><button class="btn" onclick="sendAllDemo()">डेमो SMS रन</button>`);
 else if(type==='committee')committeeModal();
 else if(type==='complaints')complaintModal();
 else if(type==='feedback')feedbackModal();
 else if(type==='legal')legalModal();
 else if(type==='act')actModal();
 else if(type==='water')waterModal();
 else if(type==='caretaker')caretakerModal();
 else if(type==='auditReport')auditReportModal();
 else if(type==='audit')openHtml(`<h2>Audit Log</h2><div class="card">${state.audit.length?state.audit.slice(0,30).map(a=>`<div class="row"><div><b>${esc(a.action)}</b><div class="muted">${esc(a.detail)}</div></div><small>${esc(a.date)}</small></div>`).join(''):'<div class="empty">नोंदी नाहीत.</div>'}</div>`);
 else if(type==='profile')openHtml(`<h2>Login / Access</h2><div class="card"><div class="row"><span>सध्याची भूमिका</span><b>${state.role==='admin'?'ADMIN':'MEMBER'}</b></div><div class="form"><button class="btn" onclick="requestAdminPIN()">Admin Mode — PIN Required</button><select id="memberRoleSelect">${state.members.map(m=>`<option value="${m.flat}" ${m.flat===state.selectedMemberFlat?'selected':''}>${esc(m.name)} — ${esc(m.flat)}</option>`).join('')}</select><button class="btn secondary" onclick="switchRole('member',document.getElementById('memberRoleSelect').value)">Member Mode</button></div><p class="muted" style="margin-top:10px">Member Mode मध्ये फक्त निवडलेल्या सभासदाचा स्वतःचा डेटा दिसेल.</p></div>`);
 else if(type==='bulk')openHtml(`<h2>Bulk Maintenance Action</h2><p class="muted">डेमो: सप्टेंबर 2026 साठी सर्व 52 सभासदांना भरले म्हणून नोंदवा.</p><button class="btn" onclick="state.members.forEach(m=>{if(!m.paidMonths.includes('Sep 2026'))m.paidMonths.push('Sep 2026')});state.audit.unshift({date:new Date().toLocaleString('mr-IN'),action:'Bulk payment demo',detail:'52 सभासद भरले'});save();closeModal();render();alert('सर्व 52 सभासदांना डेमोमध्ये भरले म्हणून नोंदवले.');">सर्व भरले म्हणून नोंदवा</button>`);
 else if(type==='addmember')openHtml(`<h2>सभासद जोडा</h2><div class="form"><input placeholder="सभासदाचे नाव"><input placeholder="मोबाइल"><input placeholder="फ्लॅट क्रमांक"><button class="btn" onclick="alert('डेमो: backend save + आवश्यक कागदपत्रे लागू केली जातील.')">जतन करा</button></div>`);
 else if(type==='notice')openHtml(`<h2>नवीन सूचना</h2><div class="form"><input placeholder="सूचना शीर्षक"><select><option>सामान्य</option><option>देखभाल</option><option>सभा</option><option>पाणी</option></select><textarea rows="4" placeholder="मजकूर"></textarea><input type="file"><button class="btn" onclick="closeModal();alert('डेमो सूचना स्थानिकरित्या नोंदली.')">प्रकाशित करा</button></div>`);
 else if(type==='document')openHtml(`<h2>दस्तऐवज</h2><div class="card"><b>नोंदणी प्रमाणपत्र</b><div class="row"><span>नोंदणी क्रमांक</span><b>${esc(SOCIETY.registration)}</b></div><div class="row"><span>नोंदणी दिनांक</span><b>${esc(SOCIETY.certificateDate)}</b></div><p class="muted">नोंदणी प्रमाणपत्राचा संदर्भ या पोर्टलमध्ये समाविष्ट आहे. Production मध्ये secure object storage + access audit आवश्यक.</p></div>`);
 else if(type==='redevelopment')openHtml(`<h2>पुनर्विकास</h2><div class="grid"><div class="card metric"><small>PMC</small><b>3</b></div><div class="card metric"><small>Consent</small><b>78%</b></div><div class="card metric"><small>Documents</small><b>24</b></div><div class="card metric"><small>Status</small><b>Active</b></div></div><div class="card"><div class="row"><span>PMC shortlist</span><span class="pill ok">पूर्ण</span></div><div class="row"><span>Developer proposals</span><span class="pill warn">Review</span></div></div>`);
 else if(type==='meeting')openHtml(`<h2>नवीन सभा / AGM</h2><div class="form"><select id="mtype"><option>समिती बैठक</option><option>AGM</option><option>SGM</option></select><input id="mdate" placeholder="दिनांक"><input id="mtime" placeholder="वेळ"><textarea id="magenda" rows="3" placeholder="अजेंडा"></textarea><textarea id="mpresent" rows="3" placeholder="उपस्थित सदस्यांची नावे (comma separated)"></textarea><textarea id="mconsent" rows="3" placeholder="Consents / संमती नोंद"></textarea><textarea id="mmom" rows="5" placeholder="MOM / बैठकीचे इतिवृत्त"></textarea><button class="btn" onclick="addMeeting()">जतन करा</button></div>`);
 else if(type==='newcomplaint')openHtml(`<h2>तक्रार नोंदवा</h2><div class="form"><input id="csub" placeholder="तक्रारीचा विषय"><textarea id="ctxt" rows="4" placeholder="तक्रारीचे सविस्तर वर्णन"></textarea><input type="file"><button class="btn" onclick="addComplaint()">तक्रार पाठवा</button></div>`);
 else if(type==='newfeedback')openHtml(`<h2>Feedback / Concerns</h2><div class="form"><select id="ftype"><option>Feedback</option><option>Concern</option><option>Suggestion</option></select><textarea id="ftext" rows="4" placeholder="आपला अभिप्राय / चिंता"></textarea><button class="btn" onclick="addFeedback()">पाठवा</button></div>`);
 else if(type==='penalty')openHtml(`<h2>दंड नोंदवा</h2><div class="form"><input placeholder="सभासद"><input placeholder="दंडाचे कारण"><input type="number" placeholder="रक्कम"><button class="btn" onclick="alert('डेमो: दंड नोंदवला जाईल.')">जतन करा</button></div>`);
 else if(type==='legaladd')openHtml(`<h2>कायदेशीर कारवाई नोंदवा</h2><div class="form"><input placeholder="सभासद"><select><option>पहिली नोटीस</option><option>दुसरी नोटीस</option><option>अंतिम नोटीस</option><option>कायदेशीर वसुली प्रक्रिया</option></select><input placeholder="दिनांक"><button class="btn" onclick="alert('डेमो: कारवाई नोंदवली जाईल.')">जतन करा</button></div>`);
}
function switchRole(role,flat){if(role==='admin'){requestAdminPIN();return}state.role='member';if(flat)state.selectedMemberFlat=flat;state.tab='home';save();closeModal();render()}
function memberPortal(){let m=state.members.find(x=>x.flat===state.selectedMemberFlat)||state.members[0];let docs=Object.entries(m.documents).map(([k,v])=>`<div class="doc"><b>${label(k)}</b><div class="muted">${v}</div></div>`).join('');let due=fyMonths('2026-27').filter(x=>!isPaid(m,x)).length*m.maintenance;return `<section class="hero"><h1>श्री साई सहकारी गृहनिर्माण संस्था मर्यादित</h1><p>Member Dashboard • सभासद पोर्टल</p><div class="statusbar"><span class="badge">${esc(m.name)}</span><span class="badge">फ्लॅट: ${esc(m.flat)}</span></div></section><div class="grid"><div class="card metric"><small>मासिक देखभाल</small><b>${money(m.maintenance)}</b></div><div class="card metric"><small>2026-27 थकबाकी</small><b>${money(due)}</b></div><div class="card metric"><small>मोबाइल</small><b style="font-size:15px">${esc(m.mobile)}</b></div><div class="card metric"><small>स्थिती</small><b style="font-size:15px">${esc(m.ownerStatus)}</b></div></div><div class="section"><h2>माझी देखभाल</h2></div><div class="card">${fyMonths('2026-27').map(month=>`<div class="row"><span>${month}</span><span class="pill ${isPaid(m,month)?'ok':'bad'}">${isPaid(m,month)?'भरले':'बाकी ₹1,000'}</span></div>`).join('')}</div><div class="section"><h2>माझी कागदपत्रे</h2></div><div class="docgrid">${docs}</div><div class="section"><h2>माझी भाडेकरू माहिती</h2></div><div class="card">${m.tenant?`<div class="row"><span>नाव</span><b>${esc(m.tenant.name)}</b></div><div class="row"><span>मोबाइल</span><b>${esc(m.tenant.mobile)}</b></div><div class="row"><span>NOC</span><b>${esc(m.noc)}</b></div>`:'<span class="pill ok">भाडेकरू नोंद नाही</span>'}</div>`}
function addMeeting(){let m={type:document.getElementById('mtype').value,date:document.getElementById('mdate').value||new Date().toLocaleDateString('mr-IN'),time:document.getElementById('mtime').value||'',agenda:document.getElementById('magenda').value||'',presentMembers:document.getElementById('mpresent').value.split(',').map(x=>x.trim()).filter(Boolean),consents:document.getElementById('mconsent').value||'',mom:document.getElementById('mmom').value||'MOM प्रलंबित',attendees:document.getElementById('mpresent').value.split(',').map(x=>x.trim()).filter(Boolean).length};state.meetings.unshift(m);state.audit.unshift({date:new Date().toLocaleString('mr-IN'),action:'नवीन सभा',detail:`${m.type} • ${m.date}`});save();closeModal();openModal('committee')}
function auditReportModal(){let fy=state.currentFY;let months=fyMonths(fy);let totalDue=state.members.reduce((s,m)=>s+months.length*m.maintenance,0);let totalReceived=state.members.reduce((s,m)=>s+months.filter(x=>isPaid(m,x)).length*m.maintenance,0);let outstanding=totalDue-totalReceived;let fullyPaid=state.members.filter(m=>months.every(x=>isPaid(m,x))).length;openHtml(`<h2>Financial Year Audit Report</h2><div class="adminbar"><div class="two"><select onchange="state.currentFY=this.value;save();auditReportModal()"><option value="2026-27" ${fy==='2026-27'?'selected':''}>2026-27</option><option value="2025-26" ${fy==='2025-26'?'selected':''}>2025-26</option></select><div class="card" style="margin:0"><b>52 सभासद</b></div></div></div><div class="grid"><div class="card metric"><small>एकूण देणी</small><b>${money(totalDue)}</b></div><div class="card metric"><small>प्राप्त</small><b>${money(totalReceived)}</b></div><div class="card metric"><small>थकबाकी</small><b>${money(outstanding)}</b></div><div class="card metric"><small>पूर्ण भरलेले</small><b>${fullyPaid}/52</b></div></div><div class="section"><h2>महिनानिहाय स्थिती</h2></div><div class="card">${months.map(month=>{let rec=state.members.filter(m=>isPaid(m,month)).reduce((s,m)=>s+m.maintenance,0);return `<div class="row"><span>${month}</span><span>${money(rec)} / ${money(52000)}</span></div>`}).join('')}</div><button class="btn" onclick="window.print()">Print / PDF</button>`)}
function addComplaint(){let s=document.getElementById('csub').value.trim();let t=document.getElementById('ctxt').value.trim();if(!s||!t)return alert('विषय आणि वर्णन भरा.');let id='C-'+(1025+state.complaints.length);state.complaints.unshift({id,subject:s,status:'नवीन',date:new Date().toLocaleDateString('mr-IN'),member:'सभासद'});state.lastComplaintNotice++;state.audit.unshift({date:new Date().toLocaleString('mr-IN'),action:'नवीन तक्रार',detail:`${id} • ${s}`});save();closeModal();alert('तक्रार समितीकडे सूचना म्हणून नोंदवली.');openModal('complaints')}
function addFeedback(){let t=document.getElementById('ftext').value.trim();if(!t)return alert('अभिप्राय लिहा.');state.feedback.unshift({type:document.getElementById('ftype').value,text:t,status:'नवीन',date:new Date().toLocaleDateString('mr-IN')});save();closeModal();alert('अभिप्राय नोंदवला.');openModal('feedback')}
function openHtml(html){document.getElementById('sheet').innerHTML=html+`<button class="btn secondary no-print" style="width:100%;margin-top:10px" onclick="closeModal()">बंद करा</button>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function demoDoc(flat,key){alert(`${label(key)}: ${flat} साठी डेमो दस्तऐवज कृती. Production मध्ये सुरक्षित storage + audit log.`)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));render();
</script>
</body></html>
